name: Adapter image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/syntaxjason/fs25-pterodactyl

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is about 7.3 GB and the layers need more during the build;
      # standard runners only have a few GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.title=FS25 Pterodactyl Adapter
            org.opencontainers.image.description=Pterodactyl adapter for arch-fs25server (Wine/Xvfb, no VNC). Contains no game files or licenses.

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Proves that users can pull without logging in. Fails while the package
      # is still private (the default on first publication).
      - name: Anonymous pull test
        if: github.event_name != 'pull_request'
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker logout ghcr.io || true
          docker manifest inspect "$IMAGE:latest" >/dev/null \
            || { echo "::error::Package is not public. Set its visibility to Public under Package settings."; exit 1; }
          echo "Anonymous access OK"
