name: Adapter-Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/syntaxjason/fs25-pterodactyl

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Das Image wird ca. 7,3 GB gross, die Layer belegen waehrend des Builds
      # mehr. Standard-Runner haben nur wenige GB frei.
      - name: Speicher freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.title=FS25 Pterodactyl Adapter
            org.opencontainers.image.description=Pterodactyl-Adapter für arch-fs25server (Wine/Xvfb, ohne VNC). Enthaelt keine Spieldateien oder Lizenzen.

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Beweis, dass Nutzer ohne Anmeldung pullen koennen. Schlaegt fehl, solange
      # das Paket noch privat ist (Standard bei der ersten Veroeffentlichung).
      - name: Anonymer Pull-Test
        if: github.event_name != 'pull_request'
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker logout ghcr.io || true
          docker manifest inspect "$IMAGE:latest" >/dev/null \
            || { echo "::error::Paket ist nicht oeffentlich. Sichtbarkeit unter Package settings auf Public stellen."; exit 1; }
          echo "Anonymer Zugriff OK"
